<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pemesanan</title>
</head>
<body>
  <h1>Black Gose Bistro | Pizza-on-Demand</h1>
  <p>Our 12 wood-fired pizzas are available for delivery. Build your custom pizza and we'll deliver it within an hour.</p>
  <hr>

  <form>
    <table>
      <thead>
        <tr>
          <th colspan="2">Your Information</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><label for="name">Name</label></td>
          <td>: <input type="text" id="name"></td>
        </tr>
        <tr>
          <td><label for="address">Address</label></td>
          <td>: <input type="text" id="address"></td>
        </tr>
        <tr>
          <td><label for="phone">No. Handphone</label></td>
          <td>: <input type="text" id="phone"></td>
        </tr>
        <tr>
          <td><label for="email">Email</label></td>
          <td>: <input type="email" id="email"></td>
        </tr>
        <tr>
          <td><label for="delivery">Delivery Instructions</label></td>
          <td>: <textarea id="delivery"></textarea></td>
        </tr>
      </tbody>
    </table>

    <fieldset>
      <legend>Design your dream pizza</legend>

      <h4>Crust (Choose one):</h4>
      <ul>
        <li><input type="radio" id="classic" name="crust"><label for="classic">Classic White</label></li>
        <li><input type="radio" id="multigrain" name="crust"><label for="multigrain">Multigrain</label></li>
        <li><input type="radio" id="unamelt" name="crust"><label for="unamelt">Una Melt</label></li>
        <li><input type="radio" id="cheesy" name="crust"><label for="cheesy">Cheesy Galore</label></li>
      </ul>

      <h4>Toppings (Choose as many as you want):</h4>
      <ul style="list-style-type: none;">
        <li><input type="checkbox" id="white"><label for="white">White Sauce</label></li>
        <li><input type="checkbox" id="mozzarella"><label for="mozzarella">Mozzarella Cheese</label></li>
        <li><input type="checkbox" id="pepperoni"><label for="pepperoni">Pepperoni</label></li>
        <li><input type="checkbox" id="mushrooms"><label for="mushrooms">Mushrooms</label></li>
        <li><input type="checkbox" id="peppers"><label for="peppers">Peppers</label></li>
        <li><input type="checkbox" id="anchovies"><label for="anchovies">Anchovies</label></li>
        <li><input type="checkbox" id="pineapple"><label for="pineapple">Pineapple</label></li>
      </ul>

      <h4>Number</h4>
      <label for="count">How Many Pizzas?</label>
      <input type="number" id="count" min="1" value="1">

      <br><br>
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </fieldset>
  </form>
</body>
</html>
