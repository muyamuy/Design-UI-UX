<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Login Authentication</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main style="max-width:400px;margin:40px auto;font-family:Arial,Helvetica,sans-serif">
    <h2>Login</h2>
    <form id="loginForm">
      <label>Username<br/><input type="text" id="username" required></label><br/><br/>
      <label>Password<br/><input type="password" id="password" required></label><br/><br/>
      <button type="submit">Login</button>
    </form>
  </main>
  <script src="js/otentikasi.js"></script>
</body>
</html>
